<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="入金計算">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>入金計算</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f3f4f6;
    --bg-card: #ffffff;
    --border: #d1d5db;
    --text: #111827;
    --text-sub: #6b7280;
    --accent: #2563eb;
    --error-bg: #fee2e2;
    --error-text: #991b1b;
    --header-bg: #f3f4f6;
    --deposit-bg: #eff6ff;
    --reserve-bg: #f0fdf4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-sub: #94a3b8;
      --accent: #60a5fa;
      --error-bg: #7f1d1d;
      --error-text: #fecaca;
      --header-bg: #334155;
      --deposit-bg: #1e3a5f;
      --reserve-bg: #1e3a2f;
    }
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', Meiryo, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }

  /* ===================== HOME SCREEN ===================== */
  .screen-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: var(--bg);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .home-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 16px;
    padding: 40px 32px;
    padding-top: max(60px, calc(40px + env(safe-area-inset-top)));
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }
  .home-title {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 16px;
    letter-spacing: 0.05em;
  }
  .home-btn {
    width: 100%;
    max-width: 320px;
    height: 60px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid var(--accent);
    background: var(--accent);
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .home-btn:active { opacity: 0.8; }
  .home-btn.secondary {
    background: var(--bg-card);
    color: var(--accent);
  }

  /* ===================== NAV BAR (入力 screen top) ===================== */
  .sticky-top {
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-bar {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
  }
  .nav-back {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 0;
    min-height: 36px;
    white-space: nowrap;
    touch-action: manipulation;
  }

  /* ===================== TOTALS BAR ===================== */
  .totals-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .total-item {
    background: var(--bg-card);
    padding: 10px 6px;
    text-align: center;
    min-width: 0;
  }
  .total-item.deposit { background: var(--deposit-bg); }
  .total-item.reserve { background: var(--reserve-bg); }
  .total-item .label {
    display: block;
    font-size: 11px;
    color: var(--text-sub);
    letter-spacing: 0.05em;
  }
  .total-item .value {
    display: block;
    font-size: 18px;
    font-weight: 700;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }

  .settings {
    padding: 10px 12px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .target-select {
    display: flex;
    gap: 4px;
  }
  .target-select label {
    cursor: pointer;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    background: var(--bg);
    user-select: none;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
  }
  .target-select input { display: none; }
  .target-select input:checked + span { color: #fff; }
  .target-select label:has(input:checked) {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #reset-btn {
    margin-left: auto;
    padding: 0 16px;
    height: 44px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
  }
  #reset-btn:active { background: var(--header-bg); }

  #error {
    margin: 10px 12px 0;
    padding: 10px 12px;
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 6px;
    font-weight: 500;
    font-size: 14px;
  }
  #error div + div { margin-top: 4px; }
  .hidden { display: none !important; }

  .custom-details {
    margin: 10px 12px 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .custom-details summary {
    padding: 12px;
    cursor: pointer;
    background: var(--header-bg);
    user-select: none;
    font-weight: 500;
    font-size: 14px;
    list-style: none;
  }
  .custom-details summary::-webkit-details-marker { display: none; }
  .custom-details summary::before {
    content: '▶ ';
    font-size: 10px;
    margin-right: 4px;
    transition: transform 0.15s;
    display: inline-block;
  }
  .custom-details[open] summary::before { transform: rotate(90deg); }
  .custom-hint {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-sub);
    border-bottom: 1px solid var(--border);
  }

  .tables-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 10px;
    padding: 10px 12px 10px;
  }
  @media (max-width: 899px) {
    .tables-grid { grid-template-columns: 1fr; gap: 8px; padding: 8px 8px 10px; }
  }

  .table-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .table-section.combined { border-color: var(--accent); }
  .table-section h2 {
    margin: 0;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .table-section h2 .total {
    font-variant-numeric: tabular-nums;
    font-size: 15px;
  }

  .deposit-info {
    padding: 5px 12px;
    font-size: 12px;
    color: var(--text-sub);
    border-bottom: 1px solid var(--border);
    background: var(--deposit-bg);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .deposit-info .status-ok { color: #16a34a; font-weight: 700; }
  .deposit-info .status-ng { color: var(--error-text); font-weight: 700; }

  thead th.head-dep, thead th.head-res {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
  }
  thead th.head-dep { background: var(--deposit-bg); color: var(--accent); }
  thead th.head-res { background: var(--reserve-bg); color: #16a34a; }
  thead th.head-dep .total, thead th.head-res .total {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    margin-left: 6px;
    color: var(--text);
  }
  td.sep-col, th.sep-col { border-right: 2px solid var(--border); }

  .tables-grid.has-error .table-section.combined { border-color: var(--error-text); }
  .tables-grid.has-error thead th.head-dep,
  .tables-grid.has-error thead th.head-res {
    background: var(--error-bg);
    color: var(--error-text);
  }
  .tables-grid.has-error .deposit-info {
    background: var(--error-bg);
    color: var(--error-text);
  }
  .tables-grid.has-error .deposit-info .status-ng { color: inherit; }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 6px 8px;
    border: 1px solid var(--border);
    text-align: right;
    font-size: 14px;
  }
  th:first-child, td:first-child {
    text-align: left;
    white-space: nowrap;
  }
  thead th {
    background: var(--header-bg);
    font-weight: normal;
    color: var(--text-sub);
    font-size: 11px;
    padding: 6px 8px;
    text-align: center;
  }
  thead th:first-child { text-align: center; }

  td.value-cell {
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    padding: 12px 8px;
  }
  td.no-roll { color: var(--text-sub); text-align: center; }
  td.input-cell { padding: 4px; }

  input.num-input {
    width: 100%;
    min-width: 50px;
    padding: 12px 8px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    text-align: right;
    font-variant-numeric: tabular-nums;
    -webkit-appearance: none;
    appearance: none;
  }
  input.num-input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: transparent;
    background: var(--bg-card);
  }
  input.num-input::placeholder { color: var(--text-sub); opacity: 0.5; }

  td.zero { color: var(--text-sub); }
  td.custom-val { color: #dc2626; }
  .table-section.combined tbody tr:nth-child(4) td { border-bottom: 2px solid var(--text-sub); }

  @media (max-width: 899px) {
    .total-item .value { font-size: 16px; }
    .total-item .label { font-size: 10px; }
    th, td { padding: 8px 6px; font-size: 14px; }
    td.value-cell { padding: 14px 6px; }
    input.num-input { padding: 14px 8px; font-size: 16px; }
    .table-section h2 { padding: 12px; font-size: 15px; }
    .table-section h2 .total { font-size: 16px; }
  }
  @media (max-width: 899px) {
    .table-section.combined th,
    .table-section.combined td { padding: 6px 4px; font-size: 13px; }
    .table-section.combined td.value-cell { padding: 10px 4px; }
  }
  @media (min-width: 900px) {
    .table-section.combined th:nth-child(1),
    .table-section.combined td:nth-child(1) { width: 22%; }
    .table-section.combined th:nth-child(2),
    .table-section.combined td:nth-child(2) { width: 19%; }
    .table-section.combined th:nth-child(3),
    .table-section.combined td:nth-child(3) { width: 19%; }
    .table-section.combined th:nth-child(4),
    .table-section.combined td:nth-child(4) { width: 19%; }
    .table-section.combined th:nth-child(5),
    .table-section.combined td:nth-child(5) { width: 21%; }
  }

  /* ===================== NAV TITLE ===================== */
  .nav-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  /* ===================== TOP BAR SUB-VALUE ===================== */
  .bar-sub {
    display: block;
    font-size: 11px;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
    color: var(--text-sub);
  }
  .bar-sub.ok  { color: #16a34a; font-weight: 700; }
  .bar-sub.pos { color: var(--accent); }
  .bar-sub.neg { color: var(--error-text); }

  /* ===================== MANUAL DATE ROW ===================== */
  .manual-date-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
  }
  .manual-date-label {
    font-size: 13px;
    color: var(--text-sub);
    white-space: nowrap;
  }
  .manual-date-input {
    flex: 1;
    padding: 8px 10px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    pointer-events: none;
  }

  /* ===================== MANUAL TABLES ===================== */
  .manual-tables {
    padding: 8px 8px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .table-section.deposit-section { border-color: var(--accent); }
  .table-section.reserve-section { border-color: #16a34a; }
  .table-section.deposit-section h2 { background: var(--deposit-bg); color: var(--accent); }
  .table-section.reserve-section h2 { background: var(--reserve-bg); color: #16a34a; }


  /* タブレット横画面: 3テーブルを横一列 */
  @media (min-width: 700px) and (orientation: landscape),
         (min-width: 1000px) {
    .manual-tables {
      flex-direction: row;
      align-items: flex-start;
    }
    .manual-tables .table-section {
      flex: 1;
      min-width: 0;
    }
  }

  /* ===================== SAVE BUTTON ===================== */
  .save-area {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  .save-btn {
    width: 100%;
    height: 52px;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .save-btn:active { opacity: 0.85; }

  /* ===================== TOAST ===================== */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #16a34a;
    color: #fff;
    padding: 10px 24px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    z-index: 2000;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }

  /* ===================== CUSTOM KEYBOARD ===================== */
  .custom-kb {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 200;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    padding: 6px 6px env(safe-area-inset-bottom);
    box-shadow: 0 -2px 12px rgba(0,0,0,0.15);
  }
  .kb-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 5px;
  }
  .kb-grid button {
    height: 52px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 20px;
    font-weight: 500;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
  }
  .kb-grid button:active { background: var(--header-bg); }
  .kb-grid .kb-zero { grid-column: span 2; }
  .kb-grid .kb-done { grid-column: span 2; background: var(--accent); color: #fff; border-color: var(--accent); font-size: 16px; }
  .kb-grid .kb-done:active { opacity: 0.85; }
  .kb-grid [data-action="bs"]  { font-size: 18px; font-weight: 700; }
  .kb-grid [data-action="prev"],
  .kb-grid [data-action="next"] { font-size: 20px; font-weight: 700; color: var(--accent); }

  #scroll-container {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
  }

  /* ===================== CONFIRM SCREEN ===================== */
  .confirm-header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 14px 12px;
    padding-top: calc(14px + env(safe-area-inset-top));
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .confirm-header h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
  }
  .export-btn {
    margin-left: auto;
    padding: 7px 12px;
    background: var(--bg-card);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .export-btn:active { background: var(--deposit-bg); }
  .confirm-body { padding: 0; }
  .confirm-empty {
    text-align: center;
    color: var(--text-sub);
    padding: 60px 24px;
    font-size: 15px;
  }
  .history-table {
    width: 100%;
    border-collapse: collapse;
  }
  .history-table th {
    background: var(--header-bg);
    font-size: 12px;
    color: var(--text-sub);
    font-weight: normal;
    padding: 8px 10px;
    text-align: right;
    border: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .history-table th:first-child { text-align: left; }
  .history-table td {
    padding: 14px 10px;
    border: 1px solid var(--border);
    font-size: 14px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .history-table tbody tr { cursor: pointer; }
  .history-table tbody tr:active { background: var(--header-bg); }
  .date-cell {
    text-align: left !important;
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }

  /* ===================== DETAIL MODAL (bottom sheet) ===================== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 600;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: flex-end;
  }
  .modal-sheet {
    background: var(--bg-card);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .modal-grip {
    display: flex;
    justify-content: center;
    padding: 12px;
    cursor: pointer;
  }
  .modal-grip::after {
    content: '';
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    display: block;
  }
  .modal-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px 12px;
  }
  .modal-title { font-size: 16px; font-weight: 700; margin: 0; }
  .modal-close-btn {
    background: none;
    border: none;
    font-size: 22px;
    color: var(--text-sub);
    cursor: pointer;
    padding: 4px 8px;
    touch-action: manipulation;
  }
  .modal-body { padding: 0 12px 20px; }
  .modal-summary {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .ms-item {
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 6px;
    text-align: center;
  }
  .ms-item.dep { background: var(--deposit-bg); }
  .ms-item.res { background: var(--reserve-bg); }
  .ms-label {
    font-size: 11px;
    color: var(--text-sub);
    display: block;
    margin-bottom: 4px;
  }
  .ms-value {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }
  .detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .detail-table th {
    padding: 6px 4px;
    border: 1px solid var(--border);
    text-align: center;
    font-size: 11px;
    font-weight: normal;
    color: var(--text-sub);
    background: var(--header-bg);
  }
  .detail-table th.th-reg { background: var(--header-bg); color: var(--text-sub); }
  .detail-table th.th-dep { background: var(--deposit-bg); color: var(--accent); }
  .detail-table th.th-res { background: var(--reserve-bg); color: #16a34a; }
  .detail-table th:first-child { text-align: left; }
  .detail-table td {
    padding: 10px 4px;
    border: 1px solid var(--border);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .detail-table td:first-child { text-align: left; white-space: nowrap; padding-left: 8px; }
  .detail-table td.no-roll-d { text-align: center; color: var(--text-sub); }
  .detail-table td.sep { border-right: 2px solid var(--border); }
  .detail-table tbody tr:nth-child(4) td { border-bottom: 2px solid var(--text-sub); }
</style>
</head>
<body>

<!-- ===== HOME SCREEN ===== -->
<div id="screen-home" class="screen-overlay">
  <div class="home-wrap">
    <h1 class="home-title">入金計算</h1>
    <button id="btn-to-manual" class="home-btn">手動入力</button>
    <button id="btn-to-input" class="home-btn secondary">自動計算</button>
    <button id="btn-to-confirm" class="home-btn secondary">確認</button>

<script>
(function () {
  'use strict';

  const DENOMS = [
    { key: '10000', label: '10000円', value: 10000, hasRoll: false, depositable: true,  allIn: false },
    { key: '5000',  label: '5000円',  value: 5000,  hasRoll: false, depositable: false, allIn: false },
    { key: '2000',  label: '2000円',  value: 2000,  hasRoll: false, depositable: true,  allIn: false },
    { key: '1000',  label: '1000円',  value: 1000,  hasRoll: false, depositable: true,  allIn: false },
    { key: '500',   label: '500円',   value: 500,   hasRoll: true,  depositable: false, allIn: false },
    { key: '100',   label: '100円',   value: 100,   hasRoll: true,  depositable: true,  allIn: false },
    { key: '50',    label: '50円',    value: 50,    hasRoll: true,  depositable: true,  allIn: false },
    { key: '10',    label: '10円',    value: 10,    hasRoll: true,  depositable: true,  allIn: false },
    { key: '5',     label: '5円',     value: 5,     hasRoll: true,  depositable: true,  allIn: true  },
    { key: '1',     label: '1円',     value: 1,     hasRoll: true,  depositable: true,  allIn: true  },
  ];
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  const ROLL_COUNT = 50;
  const BILLS_PRIMARY  = ['10000', '2000', '1000'];
  const BILLS_FALLBACK = ['5000'];
  const COINS_ORDER    = ['500', '100', '50', '10'];
  const RESERVED_1000_COUNT = 30;
  const STORAGE_KEY   = 'nyukin_keisan_v1';
  const HISTORY_KEY   = 'nyukin_history_v1';

  const DENOM_MAP = new Map(DENOMS.map(d => [d.key, d]));

  const state = {
    target: 300000,
    register: {},
    custom: {},
  };

  function resetState() {
    DENOMS.forEach(d => {
      state.register[d.key] = { count: 0, rolls: 0 };
      state.custom[d.key]   = { count: null, rolls: null };
    });
  }
  resetState();

  let manualTarget = 300000;

  const manualState = { register: {}, deposit: {}, reserve: {} };
  function resetManualState() {
    DENOMS.forEach(d => {
      manualState.register[d.key] = { count: 0, rolls: 0 };
      manualState.deposit[d.key]  = { count: 0, rolls: 0 };
      manualState.reserve[d.key]  = { count: 0, rolls: 0 };
    });
  }
  resetManualState();

  function denomOf(key) { return DENOM_MAP.get(key); }

  function totalOf(stockMap) {
    let total = 0;
    DENOMS.forEach(d => {
      const s = stockMap[d.key];
      if (!s) return;
      total += (s.count || 0) * d.value;
      if (d.hasRoll) total += (s.rolls || 0) * ROLL_COUNT * d.value;
    });
    return total;
  }

  function formatYen(n) {
    const sign = n < 0 ? '-' : '';
    return sign + '¥' + Math.abs(n).toLocaleString('ja-JP');
  }

  function verifyIntegrity(deposit, reserve) {
    const errs = [];
    DENOMS.forEach(d => {
      const r = state.register[d.key];
      const dp = deposit[d.key];
      const rs = reserve[d.key];
      if (dp.count + rs.count !== r.count) {
        errs.push('【整合性エラー】' + d.label + ': 入金' + dp.count + '枚 + 準備金' + rs.count + '枚 ≠ レジ金' + r.count + '枚');
      }
      if (rs.count < 0) {
        errs.push('【整合性エラー】' + d.label + ': 翌日準備金の枚数が負（' + rs.count + '枚）');
      }
      if (d.hasRoll) {
        if (dp.rolls + rs.rolls !== r.rolls) {
          errs.push('【整合性エラー】' + d.label + '棒金: 入金' + dp.rolls + '本 + 準備金' + rs.rolls + '本 ≠ レジ金' + r.rolls + '本');
        }
        if (rs.rolls < 0) {
          errs.push('【整合性エラー】' + d.label + '棒金: 翌日準備金の本数が負（' + rs.rolls + '本）');
        }
      }
    });
    const tReg = totalOf(state.register);
    const tDep = totalOf(deposit);
    const tRes = totalOf(reserve);
    if (tReg !== tDep + tRes) {
      errs.push('【整合性エラー】合計金額が不一致（レジ金' + formatYen(tReg) + ' ≠ 銀行入金' + formatYen(tDep) + ' + 翌日準備金' + formatYen(tRes) + '）');
    }
    return errs;
  }

  function fillDenoms(keys, amount, deposit) {
    let remaining = amount;
    for (const k of keys) {
      if (remaining <= 0) break;
      if (state.custom[k].count !== null) continue;
      const d = denomOf(k);
      let available = state.register[k].count;
      if (k === '1000') available = Math.max(0, available - RESERVED_1000_COUNT);
      const add = Math.min(available, Math.floor(remaining / d.value));
      deposit[k].count = add;
      remaining -= add * d.value;
    }
    return remaining;
  }

  function calculate() {
    const errors = [];
    const deposit = {};
    DENOMS.forEach(d => { deposit[d.key] = { count: 0, rolls: 0 }; });

    const registerTotal = totalOf(state.register);
    const reserveTarget = state.target;
    const depositTarget = registerTotal - reserveTarget;

    if (depositTarget < 0) {
      errors.push('レジ金（' + formatYen(registerTotal) + '）が不足しています');
    } else {
      DENOMS.forEach(d => {
        const c = state.custom[d.key];
        const r = state.register[d.key];
        if (c.count !== null) {
          if (c.count > r.count) {
            errors.push(d.label + 'のカスタム枚数（' + c.count + '）が在庫（' + r.count + '）を超えています');
            deposit[d.key].count = r.count;
          } else {
            deposit[d.key].count = c.count;
          }
        }
        if (d.hasRoll && c.rolls !== null) {
          if (c.rolls > r.rolls) {
            errors.push(d.label + 'のカスタム棒金（' + c.rolls + '本）が在庫（' + r.rolls + '本）を超えています');
            deposit[d.key].rolls = r.rolls;
          } else {
            deposit[d.key].rolls = c.rolls;
          }
        }
      });

      DENOMS.filter(d => d.allIn).forEach(d => {
        if (state.custom[d.key].count === null) {
          deposit[d.key].count = state.register[d.key].count;
        }
      });

      let depositTotal = totalOf(deposit);

      if (depositTotal > depositTarget) {
        errors.push('カスタム指示で銀行入金額（' + formatYen(depositTarget) + '）を超えています（超過: ' + formatYen(depositTotal - depositTarget) + '）');
      } else {
        let remaining = depositTarget - depositTotal;
        const billsTarget = Math.floor(remaining / 1000) * 1000;
        const coinsTarget = remaining % 1000;

        let billsRemaining = fillDenoms(BILLS_PRIMARY, billsTarget, deposit);
        billsRemaining = fillDenoms(BILLS_FALLBACK, billsRemaining, deposit);

        if (billsRemaining >= 1000 && state.custom['5000'].count === null &&
            deposit['5000'].count < state.register['5000'].count) {
          const overshoot = 5000 - billsRemaining;
          const take1000 = state.custom['1000'].count === null
            ? Math.min(deposit['1000'].count, Math.floor(overshoot / 1000)) : 0;
          const rem = overshoot - take1000 * 1000;
          const take2000 = (rem > 0 && state.custom['2000'].count === null)
            ? Math.min(deposit['2000'].count, Math.floor(rem / 2000)) : 0;
          if (take1000 * 1000 + take2000 * 2000 === overshoot) {
            deposit['5000'].count += 1;
            deposit['1000'].count -= take1000;
            deposit['2000'].count -= take2000;
            billsRemaining = 0;
          }
        }

        remaining = fillDenoms(COINS_ORDER, coinsTarget + billsRemaining, deposit);

        if (remaining > 0) {
          errors.push('銀行入金（' + formatYen(depositTarget) + '）に充てられる金種が不足しています（不足: ' + formatYen(remaining) + '）');
        }
      }
    }

    const reserve = {};
    DENOMS.forEach(d => {
      reserve[d.key] = {
        count: state.register[d.key].count - deposit[d.key].count,
        rolls: state.register[d.key].rolls - deposit[d.key].rolls,
      };
    });

    const integrityErrors = verifyIntegrity(deposit, reserve);
    if (integrityErrors.length > 0) {
      errors.unshift.apply(errors, integrityErrors);
    }

    return { deposit, reserve, errors, depositTarget, registerTotal };
  }

  function buildInputBody(tbodyId, type) {
    const tbody = document.getElementById(tbodyId);
    tbody.innerHTML = '';
    DENOMS.forEach(d => {
      const tr = document.createElement('tr');
      const tdLabel = document.createElement('td');
      tdLabel.textContent = d.label;
      tr.appendChild(tdLabel);

      const tdCount = document.createElement('td');
      tdCount.className = 'input-cell';
      tdCount.appendChild(makeInput(d, 'count', type));
      tr.appendChild(tdCount);

      const tdRolls = document.createElement('td');
      if (d.hasRoll) {
        tdRolls.className = 'input-cell';
        tdRolls.appendChild(makeInput(d, 'rolls', type));
      } else {
        tdRolls.className = 'no-roll';
        tdRolls.textContent = '―';
      }
      tr.appendChild(tdRolls);
      tbody.appendChild(tr);
    });
  }

  function makeInput(d, field, type) {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = isTouch ? 'none' : 'numeric';
    inp.pattern = '[0-9]*';
    inp.autocomplete = 'off';
    inp.className = 'num-input ' + type + '-input';
    inp.dataset.key = d.key;
    inp.dataset.field = field;
    if (type === 'register') {
      const v = state.register[d.key][field];
      inp.value = v ? String(v) : '';
    } else {
      const v = state.custom[d.key][field];
      inp.value = v !== null ? String(v) : '';
      inp.placeholder = '自動';
    }
    return inp;
  }

  function buildManualBodies() {
    ['register', 'deposit'].forEach(section => {
      const tbody = document.getElementById('manual-' + section + '-body');
      tbody.innerHTML = '';
      DENOMS.forEach(d => {
        const tr = document.createElement('tr');
        const tdLabel = document.createElement('td');
        tdLabel.textContent = d.label;
        tr.appendChild(tdLabel);

        const tdCount = document.createElement('td');
        tdCount.className = 'input-cell';
        tdCount.appendChild(makeManualInput(d, 'count', section));
        tr.appendChild(tdCount);

        const tdRolls = document.createElement('td');
        if (d.hasRoll) {
          tdRolls.className = 'input-cell';
          tdRolls.appendChild(makeManualInput(d, 'rolls', section));
        } else {
          tdRolls.className = 'no-roll';
          tdRolls.textContent = '―';
        }
        tr.appendChild(tdRolls);
        tbody.appendChild(tr);
      });
    });
    buildManualReserveDisplay();
  }

function buildManualReserveDisplay() {
    const tbody = document.getElementById('manual-reserve-body');
    tbody.innerHTML = '';
    DENOMS.forEach(d => {
      const tr = document.createElement('tr');

      const tdLabel = document.createElement('td');
      tdLabel.textContent = d.label;
      tr.appendChild(tdLabel);

      const tdCount = document.createElement('td');
      tdCount.className = 'value-cell';
      tdCount.textContent = '0';
      manualReserveCells[d.key + ':count'] = tdCount;
      tr.appendChild(tdCount);

      const tdRolls = document.createElement('td');
      if (d.hasRoll) {
        tdRolls.className = 'value-cell';
        tdRolls.textContent = '0';
        manualReserveCells[d.key + ':rolls'] = tdRolls;
      } else {
        tdRolls.className = 'no-roll';
        tdRolls.textContent = '―';
      }
      tr.appendChild(tdRolls);
      tbody.appendChild(tr);
    });
  }

  function updateManualReserve() {
    DENOMS.forEach(d => {
      const reg = manualState.register[d.key];
      const dep = manualState.deposit[d.key];
      const count = (reg.count || 0) - (dep.count || 0);
      const rolls = (reg.rolls || 0) - (dep.rolls || 0);
      manualState.reserve[d.key] = { count, rolls };

      const cc = manualReserveCells[d.key + ':count'];
      if (cc) {
        cc.textContent = count;
        cc.classList.toggle('zero', count === 0);
        cc.style.color = count < 0 ? 'var(--error-text)' : '';
      }
      const rc = manualReserveCells[d.key + ':rolls'];
      if (rc) {
        rc.textContent = rolls;
        rc.classList.toggle('zero', rolls === 0);
        rc.style.color = rolls < 0 ? 'var(--error-text)' : '';
      }
    });
  }

  function makeManualInput(d, field, section) {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = isTouch ? 'none' : 'numeric';
    inp.pattern = '[0-9]*';
    inp.autocomplete = 'off';
    inp.className = 'num-input manual-input';
    inp.dataset.key = d.key;
    inp.dataset.field = field;
    inp.dataset.section = section;
    const v = manualState[section][d.key][field];
    inp.value = v ? String(v) : '';
    return inp;
  }

  function updateManualTotals() {
    updateManualReserve();
    const tReg = totalOf(manualState.register);
    const tDep = totalOf(manualState.deposit);
    const tRes = totalOf(manualState.reserve);

    const depTarget = Math.max(0, tReg - manualTarget);
    const depMatched = tReg > 0 && tDep === depTarget;
    const resMatched = tReg > 0 && tRes === manualTarget;

    elManualBarRegister.textContent = formatYen(tReg);
    document.getElementById('manual-reg-total').textContent = formatYen(tReg);
    document.getElementById('manual-dep-total').textContent = formatYen(tDep);
    document.getElementById('manual-res-total').textContent = formatYen(tRes);

    const depDiff = depTarget - tDep;
    const resDiff = manualTarget - tRes;
    const fmtDiff = d => (d > 0 ? '+' : '') + formatYen(d);

    elManualDepTarget.textContent = formatYen(depTarget);
    elManualDepActual.textContent = tReg === 0 ? '' : depMatched ? '✓' : fmtDiff(depDiff);
    elManualDepActual.className   = 'bar-sub ' + (depMatched ? 'ok' : tReg === 0 ? '' : depDiff > 0 ? 'pos' : 'neg');

    elManualResTarget.textContent = formatYen(manualTarget);
    elManualResActual.textContent = tReg === 0 ? '' : resMatched ? '✓' : fmtDiff(resDiff);
    elManualResActual.className   = 'bar-sub ' + (resMatched ? 'ok' : tReg === 0 ? '' : resDiff > 0 ? 'pos' : 'neg');
  }

  function buildResultBody() {
    const tbody = document.getElementById('result-body');
    tbody.innerHTML = '';
    DENOMS.forEach(d => {
      const tr = document.createElement('tr');
      const tdLabel = document.createElement('td');
      tdLabel.textContent = d.label;
      tr.appendChild(tdLabel);

      ['deposit', 'reserve'].forEach(scope => {
        const sep = scope === 'deposit' ? ' sep-col' : '';

        const tdCount = document.createElement('td');
        tdCount.className = 'value-cell';
        tdCount.textContent = '0';
        resultCells[scope + ':' + d.key + ':count'] = tdCount;
        tr.appendChild(tdCount);

        const tdRolls = document.createElement('td');
        if (d.hasRoll) {
          tdRolls.className = 'value-cell' + sep;
          tdRolls.textContent = '0';
          resultCells[scope + ':' + d.key + ':rolls'] = tdRolls;
        } else {
          tdRolls.className = 'no-roll' + sep;
          tdRolls.textContent = '―';
        }
        tr.appendChild(tdRolls);
      });

      tbody.appendChild(tr);
    });
  }

  function updateResultTable(scope, stockMap) {
    DENOMS.forEach(d => {
      for (const field of ['count', 'rolls']) {
        const cell = resultCells[scope + ':' + d.key + ':' + field];
        if (!cell) continue;
        const v = stockMap[d.key][field] || 0;
        cell.textContent = v;
        cell.classList.toggle('zero', v === 0);
        cell.classList.toggle('custom-val', scope === 'deposit' && state.custom[d.key][field] !== null);
      }
    });
  }

  function alignManualTables() {
    requestAnimationFrame(() => {
      const inputRows  = document.querySelectorAll('#manual-register-body tr');
      const reserveRows = document.querySelectorAll('#manual-reserve-body tr');
      inputRows.forEach((row, i) => {
        if (reserveRows[i]) reserveRows[i].style.height = row.offsetHeight + 'px';
      });
    });
  }

  function alignTables() {
    const regBody = document.getElementById('register-body');
    const comBody = document.getElementById('result-body');
    if (!regBody || !comBody) return;

    const regHeaderRow = regBody.closest('table').querySelector('thead tr');
    if (regHeaderRow) regHeaderRow.style.height = '';

    requestAnimationFrame(() => {
      // tbodyの開始位置を揃える（ヘッダー行の高さで調整）
      if (regHeaderRow) {
        const diff = comBody.getBoundingClientRect().top - regBody.getBoundingClientRect().top;
        if (diff > 1) {
          regHeaderRow.style.height = (regHeaderRow.offsetHeight + Math.round(diff)) + 'px';
        }
      }
      // 各データ行の高さを揃える
      const inputRows = document.querySelectorAll('#register-body tr');
      const resultRows = document.querySelectorAll('#result-body tr');
      inputRows.forEach((row, i) => {
        if (resultRows[i]) resultRows[i].style.height = row.offsetHeight + 'px';
      });
    });
  }

  function updateDepositInfo(depositTarget, actual, errors) {
    const el = elDepInfo;
    if (!el) return;
    if (errors.length > 0) {
      el.innerHTML = '<span class="status-ng">✗ エラーのため計算できません</span>';
      return;
    }
    const matched = depositTarget === actual;
    el.innerHTML =
      '目標: ' + formatYen(depositTarget) +
      '　実績: ' + formatYen(actual) +
      '　<span class="' + (matched ? 'status-ok' : 'status-ng') + '">' +
      (matched ? '✓' : '✗') + '</span>';
  }

  function update() {
    const { deposit, reserve, errors, depositTarget, registerTotal } = calculate();

    updateResultTable('deposit', deposit);
    updateResultTable('reserve', reserve);

    const tDep = totalOf(deposit);
    const tRes = totalOf(reserve);

    elBarRegister.textContent = elRegTotal.textContent = formatYen(registerTotal);
    elBarDeposit.textContent  = elDepTotal.textContent = formatYen(tDep);
    elBarReserve.textContent  = elResTotal.textContent = formatYen(tRes);

    elTablesGrid.classList.toggle('has-error', errors.length > 0);
    updateDepositInfo(depositTarget, tDep, errors);

    if (errors.length) {
      elError.innerHTML = errors.map(e => '<div>⚠ ' + escapeHtml(e) + '</div>').join('');
      elError.classList.remove('hidden');
    } else {
      elError.classList.add('hidden');
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        target: state.target,
        register: state.register,
        custom: state.custom,
      }));
    } catch (e) {}
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (typeof data.target === 'number') state.target = data.target;
      if (data.register) {
        DENOMS.forEach(d => {
          if (data.register[d.key]) {
            state.register[d.key].count = Number(data.register[d.key].count) || 0;
            state.register[d.key].rolls = Number(data.register[d.key].rolls) || 0;
          }
        });
      }
      if (data.custom) {
        DENOMS.forEach(d => {
          if (data.custom[d.key]) {
            const c = data.custom[d.key].count;
            const r = data.custom[d.key].rolls;
            state.custom[d.key].count = (c == null || c === '') ? null : Number(c);
            state.custom[d.key].rolls = (r == null || r === '') ? null : Number(r);
          }
        });
      }
    } catch (e) {}
  }

  // ===== HISTORY =====
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || {}; }
    catch(e) { return {}; }
  }

  function saveHistoryData(history) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
    catch(e) {}
  }

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function saveManualRecord() {
    const dateVal = todayKey();

    const history = loadHistory();
    history[dateVal] = {
      date: dateVal,
      register: JSON.parse(JSON.stringify(manualState.register)),
      deposit:  JSON.parse(JSON.stringify(manualState.deposit)),
      reserve:  JSON.parse(JSON.stringify(manualState.reserve)),
      registerTotal: totalOf(manualState.register),
      depositTotal:  totalOf(manualState.deposit),
      reserveTotal:  totalOf(manualState.reserve),
      target: manualTarget,
      manual: true,
    };

    showToast('保存しました　' + dateVal.replace(/-/g, '/'));

  function saveRecord() {
    const { deposit, reserve } = calculate();
    const dateKey = todayKey();
    const history = loadHistory();
    history[dateKey] = {
      date: dateKey,
      register: JSON.parse(JSON.stringify(state.register)),
      deposit:  JSON.parse(JSON.stringify(deposit)),
      reserve:  JSON.parse(JSON.stringify(reserve)),
      registerTotal: totalOf(state.register),
      depositTotal:  totalOf(deposit),
      reserveTotal:  totalOf(reserve),
      target: state.target,
    };
    saveHistoryData(history);
    showToast('保存しました　' + dateKey.replace(/-/g, '/'));
  }

  function exportExcel() {
    const history = loadHistory();
    const dates = Object.keys(history).sort().reverse();
    if (dates.length === 0) {
      alert('保存データがありません');
      return;
    }

    const doExport = () => {
      const BG_HDR = 'F3F4F6';
      const BG_REG = 'FFFFFF';
      const BG_DEP = 'DBEAFE';
      const BG_RES = 'DCFCE7';
      const THIN   = { style: 'thin',   color: { rgb: '9CA3AF' } };
      const MEDIUM = { style: 'medium',  color: { rgb: '6B7280' } };

      function makeBorder(thickBottom) {
        return { top: THIN, left: THIN, right: THIN, bottom: thickBottom ? MEDIUM : THIN };
      }

      function cs(opts) {
        const s = {
          font: { name: 'Meiryo UI', sz: 10, bold: !!opts.bold },
          alignment: { horizontal: opts.align || 'right', vertical: 'center' },
          border: makeBorder(!!opts.thick),
        };
        if (opts.bg) s.fill = { patternType: 'solid', fgColor: { rgb: opts.bg } };
        if (opts.diag) {
          s.border.diagonal    = { style: 'thin', color: { rgb: '374151' } };
          s.border.diagonalDown = true;
        }
        return s;
      }

      function sc(ws, r, c, v, s) {
        const addr = XLSX.utils.encode_cell({ r, c });
        ws[addr] = { t: typeof v === 'number' ? 'n' : 's', v: v ?? '', s };
      }

      const wb = XLSX.utils.book_new();

      dates.forEach(dateKey => {
        const rec = history[dateKey];
        const parts = dateKey.split('-');
        const sheetName = parts[1] + '-' + parts[2];
        const ws = {};

        ws['!merges'] = [
          { s: { r: 0, c: 0 }, e: { r: 1, c: 0 } },
          { s: { r: 0, c: 1 }, e: { r: 0, c: 2 } },
          { s: { r: 0, c: 3 }, e: { r: 0, c: 4 } },
          { s: { r: 0, c: 5 }, e: { r: 0, c: 6 } },
        ];
        ws['!cols'] = [10, 10, 7, 10, 7, 10, 7].map(w => ({ wch: w }));

        // Row 0: section headers
        sc(ws,0,0,'種類',     cs({ bg:BG_HDR, align:'center', bold:true }));
        sc(ws,0,1,'レジ金',   cs({ bg:BG_REG, align:'center', bold:true }));
        sc(ws,0,2,'',         cs({ bg:BG_REG, align:'center' }));
        sc(ws,0,3,'銀行入金', cs({ bg:BG_DEP, align:'center', bold:true }));
        sc(ws,0,4,'',         cs({ bg:BG_DEP, align:'center' }));
        sc(ws,0,5,'翌日準備金',cs({ bg:BG_RES, align:'center', bold:true }));
        sc(ws,0,6,'',         cs({ bg:BG_RES, align:'center' }));

        // Row 1: sub headers
        sc(ws,1,0,'',   cs({ bg:BG_HDR, align:'center' }));
        sc(ws,1,1,'枚数',cs({ bg:BG_REG, align:'center' }));
        sc(ws,1,2,'棒金',cs({ bg:BG_REG, align:'center' }));
        sc(ws,1,3,'枚数',cs({ bg:BG_DEP, align:'center' }));
        sc(ws,1,4,'棒金',cs({ bg:BG_DEP, align:'center' }));
        sc(ws,1,5,'枚数',cs({ bg:BG_RES, align:'center' }));
        sc(ws,1,6,'棒金',cs({ bg:BG_RES, align:'center' }));

        // Data rows
        DENOMS.forEach((d, i) => {
          const r = i + 2;
          const thick = i === 3; // 1000円の下に太線
          const reg = rec.register[d.key] || { count:0, rolls:0 };
          const dep = rec.deposit[d.key]  || { count:0, rolls:0 };
          const res = rec.reserve[d.key]  || { count:0, rolls:0 };

          sc(ws,r,0, d.label,   cs({ bg:BG_HDR, align:'left', thick }));
          sc(ws,r,1, reg.count, cs({ bg:BG_REG, thick }));
          sc(ws,r,2, d.hasRoll ? reg.rolls : '', cs({ bg:BG_REG, diag:!d.hasRoll, thick }));
          sc(ws,r,3, dep.count, cs({ bg:BG_DEP, thick }));
          sc(ws,r,4, d.hasRoll ? dep.rolls : '', cs({ bg:BG_DEP, diag:!d.hasRoll, thick }));
          sc(ws,r,5, res.count, cs({ bg:BG_RES, thick }));
          sc(ws,r,6, d.hasRoll ? res.rolls : '', cs({ bg:BG_RES, diag:!d.hasRoll, thick }));
        });

        // 合計 row
        const tr = DENOMS.length + 2;
        sc(ws,tr,0,'合計',            cs({ bg:BG_HDR, align:'left', bold:true }));
        sc(ws,tr,1, rec.registerTotal, cs({ bg:BG_REG, bold:true }));
        sc(ws,tr,2,'',                cs({ bg:BG_REG }));
        sc(ws,tr,3, rec.depositTotal,  cs({ bg:BG_DEP, bold:true }));
        sc(ws,tr,4,'',                cs({ bg:BG_DEP }));
        sc(ws,tr,5, rec.reserveTotal,  cs({ bg:BG_RES, bold:true }));
        sc(ws,tr,6,'',                cs({ bg:BG_RES }));

        ws['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:tr,c:6} });
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
      });

      XLSX.writeFile(wb, '入金計算_' + todayKey() + '.xlsx');
    };

    if (typeof XLSX === 'undefined') {
      showToast('ライブラリを読み込み中...');
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
      s.onload = doExport;
      s.onerror = () => alert('読み込み失敗。インターネット接続を確認してください。');
      document.head.appendChild(s);
    } else {
      doExport();
    }
  }

  // ===== DOM CACHE =====
  let activeInput = null;
  let kbEl, scrollEl, activeScrollEl, kbHeight, hideTimer;
  let elBarRegister, elBarDeposit, elBarReserve;
  let elRegTotal, elDepTotal, elResTotal;
  let elError, elTablesGrid, elDepInfo;
  let elManualBarRegister;
  let elManualDepTarget, elManualDepActual, elManualDepBar;
  let elManualResTarget, elManualResActual, elManualResBar;
  const resultCells = {};
  const manualReserveCells = {};

  function getVisibleInputs() {
    return Array.from(document.querySelectorAll('input.register-input, input.custom-input, input.manual-input'))
      .filter(i => i.offsetParent !== null);
  }

  function scrollToInput(el) {
    if (!activeScrollEl) return;
    requestAnimationFrame(() => {
      const visibleHeight = window.innerHeight - kbHeight;
      const rect = el.getBoundingClientRect();
      const offsetFromTop = rect.top + activeScrollEl.scrollTop;
      const target = offsetFromTop - visibleHeight / 2 + rect.height / 2;
      activeScrollEl.scrollTop = Math.max(0, target);
    });
  }

  function navigateInput(dir) {
    const inputs = getVisibleInputs();
    const idx = inputs.indexOf(activeInput);
    const next = inputs[idx + dir];
    if (next) {
      next.focus();
      scrollToInput(next);
    } else if (dir > 0) {
      activeInput.blur();
      hideKeyboard();
    }
  }

  function showKeyboard() {
    kbEl.classList.remove('hidden');
    if (activeScrollEl) activeScrollEl.style.bottom = kbHeight + 'px';
    if (activeInput) scrollToInput(activeInput);
  }

  function hideKeyboard() {
    kbEl.classList.add('hidden');
    if (activeScrollEl) activeScrollEl.style.bottom = '0';
    activeInput = null;
  }

  function triggerInput(el) {
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function bindInputEvents() {
    document.addEventListener('input', (e) => {
      const t = e.target;
      if (!(t instanceof HTMLInputElement)) return;
      if (!t.classList.contains('register-input') && !t.classList.contains('custom-input') && !t.classList.contains('manual-input')) return;

      const normalized = t.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
      const filtered = normalized.replace(/[^0-9]/g, '');
      if (t.value !== filtered) t.value = filtered;

      const key = t.dataset.key;
      const field = t.dataset.field;
      if (t.classList.contains('register-input')) {
        state.register[key][field] = filtered === '' ? 0 : parseInt(filtered, 10);
        save();
        update();
      } else if (t.classList.contains('custom-input')) {
        state.custom[key][field] = filtered === '' ? null : parseInt(filtered, 10);
        save();
        update();
      } else if (t.classList.contains('manual-input')) {
        manualState[t.dataset.section][key][field] = filtered === '' ? 0 : parseInt(filtered, 10);
        updateManualTotals();
      }
    });

    document.addEventListener('focusin', (e) => {
      const t = e.target;
      if (!(t instanceof HTMLInputElement) || !t.classList.contains('num-input')) return;
      if (t.readOnly) return;
      t.dataset.fresh = 'true';
      if (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) {
        clearTimeout(hideTimer);
        activeInput = t;
        showKeyboard();
      }
    });

    document.addEventListener('keydown', (e) => {
      const t = e.target;
      if (!(t instanceof HTMLInputElement) || !t.classList.contains('num-input')) return;
      if (t.dataset.fresh === 'true' && e.key >= '0' && e.key <= '9') {
        t.value = '';
        t.dataset.fresh = 'false';
      }
      if (e.key === 'Enter' &&
          (t.classList.contains('register-input') || t.classList.contains('custom-input'))) {
        e.preventDefault();
        const inputs = getVisibleInputs();
        const idx = inputs.indexOf(t);
        if (idx >= 0 && idx < inputs.length - 1) {
          const next = inputs[idx + 1];
          next.focus();
          next.select();
        } else {
          t.blur();
        }
      }
    });

    document.addEventListener('focusout', (e) => {
      if (!(navigator.maxTouchPoints > 0 || 'ontouchstart' in window)) return;
      const t = e.target;
      if (!(t instanceof HTMLInputElement) || !t.classList.contains('num-input')) return;
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => { if (document.activeElement === document.body) hideKeyboard(); }, 100);
    });

    kbEl.addEventListener('mousedown', e => e.preventDefault());
    kbEl.addEventListener('pointerdown', e => e.preventDefault());
    kbEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn || !activeInput) return;
        if (btn.dataset.n !== undefined) {
          if (activeInput.dataset.fresh === 'true') {
            activeInput.value = '';
            activeInput.dataset.fresh = 'false';
          }
          activeInput.value += btn.dataset.n;
          triggerInput(activeInput);
        } else if (btn.dataset.action === 'bs') {
          activeInput.value = activeInput.value.slice(0, -1);
          triggerInput(activeInput);
        } else if (btn.dataset.action === 'prev') {
          navigateInput(-1);
        } else if (btn.dataset.action === 'next') {
          navigateInput(1);
        } else if (btn.dataset.action === 'done') {
          const inp = activeInput;
          hideKeyboard();
          inp.blur();
        }
      });
  }

  function bindControls() {
    document.querySelectorAll('input[name="target"]').forEach(r => {
      r.addEventListener('change', () => {
        const checked = document.querySelector('input[name="target"]:checked');

    document.getElementById('save-btn').addEventListener('click', saveRecord);

    // Detail modal
    document.getElementById('detail-close').addEventListener('click', hideDetail);
    document.getElementById('detail-grip').addEventListener('click', hideDetail);
    document.getElementById('detail-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('detail-modal')) hideDetail();
    });
  }

  function init() {
    elBarRegister = document.getElementById('bar-register');
    elBarDeposit  = document.getElementById('bar-deposit');
    elBarReserve  = document.getElementById('bar-reserve');
    elRegTotal    = document.getElementById('register-total');
    elDepTotal    = document.getElementById('deposit-total');
    elResTotal    = document.getElementById('reserve-total');
    elError       = document.getElementById('error');
    elTablesGrid  = document.querySelector('.tables-grid');
    elDepInfo     = document.getElementById('deposit-info');
    elManualBarRegister = document.getElementById('manual-bar-register');
    elManualDepTarget   = document.getElementById('manual-bar-dep-target');
    elManualDepActual   = document.getElementById('manual-bar-dep-actual');
    elManualDepBar      = document.getElementById('manual-dep-bar');
    elManualResTarget   = document.getElementById('manual-bar-res-target');
    elManualResActual   = document.getElementById('manual-bar-res-actual');
    elManualResBar      = document.getElementById('manual-res-bar');

    kbEl = document.getElementById('custom-kb');
    scrollEl = document.getElementById('scroll-container');
    activeScrollEl = scrollEl;
    kbEl.classList.remove('hidden');
    kbHeight = kbEl.offsetHeight;
    kbEl.classList.add('hidden');
    load();
    const r = document.querySelector('input[name="target"][value="' + state.target + '"]');
    if (r) r.checked = true;
    buildInputBody('register-body', 'register');
    buildInputBody('custom-body', 'custom');
    buildResultBody();
    buildManualBodies();
    alignTables();
    alignManualTables();
    window.addEventListener('resize', () => { alignTables(); alignManualTables(); });
    bindInputEvents();
    bindControls();
    update();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
